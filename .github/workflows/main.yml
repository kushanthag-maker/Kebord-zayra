name: Build ZAYEA X Keyboard APK (All-in-One Auto Builder)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Auto Generate & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Generate Complete Android Project Files
        run: |
          node -e "const fs = require('fs'), path = require('path'); const data = JSON.parse(Buffer.from('', 'base64').toString('utf8')); for (const [p, c] of Object.entries(data)) { fs.mkdirSync(path.dirname(p), { recursive: true }); fs.writeFileSync(p, c); } console.log('✅ Generated all Android project files in 0.1s!');"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact
        run: |
          mkdir -p build_output
          find . -name "*.apk" -exec cp {} build_output/ZAYEA_X_Keyboard.apk \;
          ls -la build_output/

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAYEA-X-Keyboard-APK
          path: build_output/ZAYEA_X_Keyboard.apk
          retention-days: 30
